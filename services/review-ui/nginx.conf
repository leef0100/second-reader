server {
  listen 80;
  root /usr/share/nginx/html;
  # SPA: the gateway strips /review/ before proxying, assets are referenced as /review/...
  location /review/ { alias /usr/share/nginx/html/; try_files $uri $uri/ /review/index.html; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Research-Use "For research use only. Not for diagnostic use." always;
}
