[project]
name = "secondreader"
version = "0.1.0"
description = "AI second reader for medical imaging — research prototype. For research use only. Not for diagnostic use."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "pydicom>=3.0",
  "highdicom>=0.24",
  "pynetdicom>=2.1",
  "numpy>=1.26",
  "pillow>=10.0",
  "cryptography>=43.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "typer>=0.12",
  "structlog>=24.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pylibjpeg[all]>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pandas-stubs",
]

[project.scripts]
secondreader = "secondreader.cli.main:app"

[project.entry-points."secondreader.plugins"]
cxr = "secondreader.modalities.cxr.plugin:CxrPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondreader"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20"]
ignore = ["S101", "S311"]  # asserts in tests; random for synthetic fixtures

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"scripts/**" = ["T20"]
"src/secondreader/cli/**" = ["T20"]
"src/secondreader/modalities/*/cli.py" = ["B008"]  # typer.Option() idiom
"src/secondreader/core/serving/**" = ["B008"]  # FastAPI Depends()/File() idiom

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["secondreader.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires live Postgres/Orthanc (skipped when unreachable)",
  "slow: long-running (training smoke tests)",
]
filterwarnings = ["ignore::DeprecationWarning"]
