# NIH baseline at 512 px — tests the resolution hypothesis for nodule/mass (docs/research/open_source_training.md).
name: cxr-nih-512-v1
preprocess: { image_size: 512, window_low_pct: 0.5, window_high_pct: 99.5 }
gate: { min_short_side: 256, ood_percentile: 99.0 }
model: { backbone: densenet121, pretrained: true, drop_rate: 0.2 }
train:
  epochs: 6
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  early_stop_patience: 2
  num_workers: 12
  augment: true
  seed: 0
  operating_point: youden
  calibration: platt
  pos_weight: auto
  device: auto
