# First real baseline: NIH ChestX-ray14 only (patient-level 80/10/10). External tiers arrive with
# VinDr/PadChest once credentialed. Content hash of this file is part of the model version.
name: cxr-nih-baseline-v1
preprocess: { image_size: 320, window_low_pct: 0.5, window_high_pct: 99.5 }
gate: { min_short_side: 256, ood_percentile: 99.0 }
model: { backbone: densenet121, pretrained: true, drop_rate: 0.2 }
train:
  epochs: 8
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  early_stop_patience: 3
  num_workers: 4
  augment: true
  seed: 0
  operating_point: youden
  pos_weight: auto
  device: auto
