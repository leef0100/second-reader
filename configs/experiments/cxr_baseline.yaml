# Baseline chest X-ray experiment. Hash of this file is part of the model version.
name: cxr-baseline
preprocess: { image_size: 320, window_low_pct: 0.5, window_high_pct: 99.5 }
gate:
  min_short_side: 256
  ood_percentile: 99.0
model: { backbone: densenet121, pretrained: true, drop_rate: 0.2 }
train:
  epochs: 10
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001
  early_stop_patience: 3
  num_workers: 2
  augment: true
  seed: 0
  operating_point: youden
  device: auto
