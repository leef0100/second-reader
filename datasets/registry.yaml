# The only place datasets are declared. `commercial_ok` gates any future commercial
# retrain. License text MUST be re-verified and dated at download time
# (`secondreader datasets verify`) — fields below reflect the plan as of 2026-09-21.
#
# role: train | external_test | localization_eval | ood_negative | gate_training
datasets:
  nih_cxr14:
    display_name: NIH ChestX-ray14
    site: NIH Clinical Center (USA)
    n_images: 112120
    n_patients: 30805
    format: png8
    labels: [Pneumothorax, Effusion, Nodule, Mass]
    label_method: NLP-mined from reports (noisy); ~984 radiologist boxes on ~880 images
    subgroup_fields: [age, sex, view]
    license: "NIH Clinical Center release — \"The usage of the data set is unrestricted\" (FAQ Q04); must link the download site, acknowledge NIH Clinical Center, cite Wang et al. CVPR 2017"
    license_url: https://nihcc.app.box.com/v/ChestXray-NIHCC
    license_file: datasets/LICENSES/nih_cxr14.md
    license_verified: 2026-09-21
    commercial_ok: true
    role: train
    requires_credentialing: false
    human_action: none — 12 tar.gz via direct Box links (scripts/download_nih_cxr14.sh); metadata CSVs saved once through the Box web UI
    size_bytes: 45080462784
    local_root: data/raw/nih_cxr14
    metadata_csv: Data_Entry_2017_v2020.csv   # NIH replaced Data_Entry_2017.csv (Patient Gender → Patient Sex, ages fixed)
    derived_from: null
    label_map: { pneumothorax: [Pneumothorax], pleural_effusion: [Effusion], nodule_mass: [Nodule, Mass] }
  chexpert:
    display_name: CheXpert
    site: Stanford (USA)
    n_images: 224316
    n_patients: 65240
    format: jpeg
    labels: [Pneumothorax, Pleural Effusion, Lung Lesion]
    label_method: rule-based NLP labeler with uncertain class; val/test radiologist-labeled
    subgroup_fields: [age, sex, view]
    license: "Stanford University Dataset Research Use Agreement — non-commercial research only, no redistribution"
    license_url: https://stanfordaimi.azurewebsites.net/datasets/8cbd9ed4-2eb9-4565-affc-111cf4f7ebe2
    license_file: datasets/LICENSES/chexpert.md
    license_verified: 2026-09-21
    commercial_ok: false
    role: train
    requires_credentialing: false
    human_action: "click-through — free Stanford AIMI account + accept Research Use Agreement, then AzCopy link (no CITI, no signed DUA)"
    size_bytes: 505829000000   # CheXpert-v1.0.zip 471.12 GB (original resolution) per AIMI file explorer
    local_root: data/raw/chexpert
    derived_from: null
    label_map: { pneumothorax: [Pneumothorax], pleural_effusion: [Pleural Effusion], nodule_mass: [Lung Lesion] }
    uncertain_label_value: -1
  mimic_cxr:
    display_name: MIMIC-CXR
    site: BIDMC Boston (USA)
    n_images: 377110
    n_patients: 65379
    format: dicom
    labels: [Pneumothorax, Pleural Effusion, Lung Lesion]
    label_method: CheXpert labeler + NegBio on free-text reports
    subgroup_fields: [age, sex, view, longitudinal]
    license: "PhysioNet Credentialed Health Data License 1.5.0 — research only, no redistribution"
    license_url: https://physionet.org/content/mimic-cxr/
    commercial_ok: false
    role: train
    requires_credentialing: true
    derived_from: null
    label_map: { pneumothorax: [Pneumothorax], pleural_effusion: [Pleural Effusion], nodule_mass: [Lung Lesion] }
    uncertain_label_value: -1
  vindr_cxr:
    display_name: VinDr-CXR
    site: Hospital 108 + Hanoi Medical University Hospital (Vietnam)
    n_images: 18000
    n_patients: null
    format: dicom
    labels: [Pneumothorax, Pleural effusion, Nodule/Mass]
    label_method: 3 radiologists per train image, 5-radiologist consensus on test; bounding boxes
    subgroup_fields: [age, sex, vendor_partial]
    license: "PhysioNet Credentialed Health Data License 1.5.0 — research only"
    license_url: https://physionet.org/content/vindr-cxr/
    commercial_ok: false
    role: external_test
    requires_credentialing: true
    derived_from: null
    label_map: { pneumothorax: [Pneumothorax], pleural_effusion: [Pleural effusion], nodule_mass: [Nodule/Mass] }
  padchest:
    display_name: PadChest
    site: Hospital San Juan de Alicante (Spain)
    n_images: 160868
    n_patients: 67000
    format: png16
    labels: [pneumothorax, pleural effusion, nodule, mass]
    label_method: 27% physician-labeled manually; remainder RNN-labeled. Use manual subset only.
    subgroup_fields: [age, sex, view, vendor]
    license: "PADCHEST Dataset Research Use Agreement — research purposes only; no redistribution; non-academic use needs BIMCV approval"
    license_url: https://bimcv.cipf.es/bimcv-projects/padchest/padchest-dataset-research-use-agreement/
    license_file: datasets/LICENSES/padchest.md
    license_verified: 2026-09-21
    commercial_ok: false
    role: external_test
    requires_credentialing: false
    human_action: "Google Form request (name, institution, purpose, accept agreement) → BIMCV e-mails a personal download link; ~1.02 TB"
    size_bytes: 1020000000000
    local_root: data/raw/padchest
    derived_from: null
    label_map: { pneumothorax: [pneumothorax], pleural_effusion: [pleural effusion], nodule_mass: [nodule, mass] }
    manual_labels_only: true
