    license_url: https://data.mendeley.com/datasets/rscbjbr9sj/3
    license_file: datasets/LICENSES/kermany_pediatric.md
    license_verified: 2026-09-21
    commercial_ok: true
    role: ood_negative        # wrong population for the gate
    requires_credentialing: false
    human_action: none — anonymous direct download (ZhangLabData.zip, 8441154111 bytes, includes the OCT set)
    size_bytes: 8441154111
    local_root: data/raw/kermany_pediatric
    derived_from: null
  openi_iu_cxr:
