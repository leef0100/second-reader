    license_url: https://openi.nlm.nih.gov/faq
    license_file: datasets/LICENSES/openi_iu_cxr.md
    license_verified: null    # blocked — site down; re-verify before download
    commercial_ok: false
    role: ood_negative        # report-text / shift probe only; NoDerivatives → never a training source
    requires_credentialing: false
    human_action: none — anonymous download once NLM restores the site
    size_bytes: 1100000000
    local_root: data/raw/openi_iu_cxr
    derived_from: null
