events {}
http {
  client_max_body_size 512m;
  # Orthanc B basic auth injected by the gateway for local dev; real deployments
  # terminate TLS here and forward the user's identity instead.
  map $http_authorization $pacs_auth { default "Basic b3J0aGFuYzpvcnRoYW5j"; }  # orthanc:orthanc

  server {
    listen 80;
    add_header X-Research-Use "For research use only. Not for diagnostic use." always;

    location /api/ {
      proxy_pass http://api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 300s;
    }
    location /pacs-b/ {
      proxy_pass http://orthanc-b:8042/;
      proxy_set_header Authorization $pacs_auth;
      proxy_set_header Host $host;
    }
    location /review/ {
      proxy_pass http://review-ui:80/;
      proxy_set_header Host $host;
    }
    location / {
      proxy_pass http://ohif:80/;
      proxy_set_header Host $host;
    }
  }
}
